[project]
name = "ade"
version = "0.1.0"
description = "Architectural Design Engine"
readme = "README.md"
authors = [
    { name = "Jorge Juarez", email = "jorgeang33@gmail.com" },
    { name = "Miguel Angel", email = "maiki200202@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "manim>=0.20.1",
    "ply>=3.11",
]

[project.scripts]
ade = "ade:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.62",
]

[tool.ruff.lint.per-file-ignores]
# Hand-written Manim demo scenes use the idiomatic `from manim import *`.
"src/ade/animations/examples/*" = ["F403", "F405"]

[tool.ty.environment]
root = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"
